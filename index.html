<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Hidden form for Netlify Forms auto-detection -->
    <form name="leads" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="leads" />
      <input type="text" name="fullName" />
      <input type="text" name="businessName" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="location" />
      <input type="text" name="businessType" />
      <input type="text" name="businessSize" />
      <input type="text" name="websiteState" />
      <input type="text" name="monthlyRevenue" />
      <input type="text" name="leadFlowSatisfaction" />
      <input type="text" name="diagnosticScore" />
      <input type="text" name="bookedDate" />
      <input type="text" name="bookedTimeSlot" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
